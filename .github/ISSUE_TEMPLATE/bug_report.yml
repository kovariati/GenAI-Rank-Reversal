name: Bug report
description: Report a software defect in the public reproducibility code
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, dependency installation method
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact command and error
    validations:
      required: true
  - type: markdown
    attributes:
      value: "Do not upload restricted or participant-level third-party data."
